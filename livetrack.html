<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveTrack | HERO Move</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f4f8fb}.wrap{max-width:950px;margin:auto;padding:22px 16px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 35px #09233b18}#map{height:58vh;min-height:380px;border-radius:18px}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.live{background:#e8fff0;color:#087a42;padding:7px 11px;border-radius:99px;font-weight:900}.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}.meta strong{color:#08284e}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a><span class="badge green">LiveTrack™</span></header><main class="wrap"><div class="card"><div class="status"><div><span class="eyebrow">YOUR RIDE</span><h2 style="margin:3px 0">Vehicle Live Location</h2></div><span class="live" id="live">WAITING</span></div><div id="map"></div><div class="meta"><span>Last update: <strong id="updated">—</strong></span><span>Speed: <strong id="speed">—</strong></span><span>Accuracy: <strong id="accuracy">—</strong></span></div><p id="msg">Waiting for the driver to start LiveTrack™…</p></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script><script>const trip=new URLSearchParams(location.search).get('trip');const map=L.map('map').setView([13.7563,100.5018],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let marker,lastId=0;function draw(x){const ll=[x.latitude,x.longitude];if(!marker){marker=L.marker(ll).addTo(map).bindPopup('🚘 HERO Move').openPopup();map.setView(ll,16)}else marker.setLatLng(ll);updated.textContent=new Date(x.recorded_at).toLocaleTimeString();speed.textContent=x.speed_mps==null?'—':Math.round(x.speed_mps*3.6)+' km/h';accuracy.textContent=x.accuracy_m?Math.round(x.accuracy_m)+' m':'—';live.textContent='LIVE';msg.textContent='Driver location is updating live.';lastId=x.id}async function poll(){if(!trip){msg.textContent='Missing trip reference.';return}const url=HM.config.supabaseUrl+'/rest/v1/trip_live_locations?booking_id=eq.'+encodeURIComponent(trip)+'&select=id,latitude,longitude,accuracy_m,speed_mps,recorded_at&order=recorded_at.desc&limit=1';const s=HM.auth.session();const token=s?.access_token||HM.config.publishableKey;const r=await fetch(url,{headers:{apikey:HM.config.publishableKey,Authorization:'Bearer '+token}});if(r.ok){const a=await r.json();if(a[0]&&a[0].id!==lastId)draw(a[0])}}poll();setInterval(poll,3000);</script></body></html>
