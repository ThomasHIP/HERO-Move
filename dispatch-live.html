<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Dispatch | HERO Move</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{background:#f4f8fb}.wrap{padding:22px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:280px 1fr;gap:15px}.panel{background:white;border-radius:20px;padding:18px}#map{height:70vh;border-radius:17px}.trip{padding:12px;border-bottom:1px solid #e5edf2}.trip strong{display:block;color:#08284e}@media(max-width:720px){.grid{grid-template-columns:1fr}#map{height:58vh}}</style></head><body data-requires-role="owner,admin,operator,dispatcher,partner_owner"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a><span class="badge green">LIVE DISPATCH</span></header><main class="wrap"><span class="eyebrow">OPERATIONS</span><h1>Live Fleet Map</h1><div class="grid"><aside class="panel"><h3>Active LiveTracks</h3><div id="list">Waiting for vehicles…</div></aside><section class="panel"><div id="map"></div></section></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script><script>const map=L.map('map').setView([13.7563,100.5018],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const marks=new Map();async function load(){try{await HM.bootstrap();const token=HM.auth.token();if(!token)return;const since=new Date(Date.now()-30*60*1000).toISOString();const u=HM.config.supabaseUrl+'/rest/v1/trip_live_locations?recorded_at=gte.'+encodeURIComponent(since)+'&select=booking_id,latitude,longitude,speed_mps,recorded_at&order=recorded_at.desc&limit=200';const r=await fetch(u,{headers:{apikey:HM.config.publishableKey,Authorization:'Bearer '+token}});if(!r.ok)return;const rows=await r.json(),latest=new Map();rows.forEach(x=>{if(!latest.has(x.booking_id))latest.set(x.booking_id,x)});list.innerHTML='';latest.forEach((x,id)=>{const ll=[x.latitude,x.longitude];if(marks.has(id))marks.get(id).setLatLng(ll);else marks.set(id,L.marker(ll).addTo(map).bindPopup('🚘 '+id.slice(0,8)));const d=document.createElement('div');d.className='trip';d.innerHTML='<strong>🚘 '+id.slice(0,8)+'</strong>'+new Date(x.recorded_at).toLocaleTimeString()+' · '+(x.speed_mps==null?'—':Math.round(x.speed_mps*3.6)+' km/h');list.appendChild(d)});if(!latest.size)list.textContent='No active LiveTrack in the last 30 minutes.'}catch(e){list.textContent=e.message}}load();setInterval(load,4000);</script></body></html>
