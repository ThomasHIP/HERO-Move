<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet | HERO Move Enterprise</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a><div class="top-actions"><a class="btn btn-outline small-btn" href="admin.html">Dashboard</a></div></header><main class="page-shell"><div class="page-title"><div><span class="eyebrow">FLEET MANAGEMENT</span><h1>Vehicle registration & lifecycle</h1><p>Register every vehicle once, then track usage, revenue, documents, EV battery health and maintenance.</p></div></div><div class="grid-two"><form class="form-card" id="vehicleForm"><h2 style="margin-top:0;color:var(--navy)">Register Vehicle</h2><div class="form-grid"><div class="field"><label>Plate Number</label><input id="plate" required></div><div class="field"><label>Vehicle ID</label><input id="vehicleId" placeholder="Auto if blank"></div><div class="field"><label>Brand</label><input id="brand" value="MG"></div><div class="field"><label>Model</label><input id="model" value="Maxus 9"></div><div class="field"><label>Year</label><input id="year" type="number" value="2026"></div><div class="field"><label>Energy</label><select id="energy"><option>EV</option><option>Hybrid / MHV</option><option>LPG / NGV</option><option>ICE</option></select></div><div class="field"><label>Seats</label><input id="seats" type="number" value="6"></div><div class="field"><label>Odometer (km)</label><input id="odometer" type="number" value="0"></div><div class="field"><label>Status</label><select id="status"><option>Available</option><option>Booked</option><option>On Trip</option><option>Maintenance</option><option>Inactive</option></select></div><div class="field"><label>Battery Health % (EV)</label><input id="battery" type="number" min="0" max="100" value="100"></div><div class="field"><label>Next Service km</label><input id="nextServiceKm" type="number" value="10000"></div><div class="field"><label>Insurance Expiry</label><input id="insuranceExpiry" type="date"></div><div class="field"><label>Registration Expiry</label><input id="registrationExpiry" type="date"></div><div class="field full"><label>Notes</label><textarea id="vehicleNotes"></textarea></div></div><button class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">Save Vehicle</button></form><form class="form-card" id="maintenanceForm"><h2 style="margin-top:0;color:var(--navy)">Add Maintenance Record</h2><div class="form-grid"><div class="field full"><label>Vehicle</label><select id="maintenanceVehicle"></select></div><div class="field"><label>Type</label><select id="maintenanceType"><option>Periodic Service</option><option>Tires</option><option>Brakes</option><option>Battery / Charging</option><option>Air Conditioning</option><option>Repair</option><option>Inspection</option></select></div><div class="field"><label>Status</label><select id="maintenanceStatus"><option>Due Soon</option><option>Scheduled</option><option>In Progress</option><option>Completed</option></select></div><div class="field"><label>Due Date</label><input id="maintenanceDate" type="date"></div><div class="field"><label>Due km</label><input id="maintenanceKm" type="number"></div><div class="field"><label>Cost (THB)</label><input id="maintenanceCost" type="number" value="0"></div><div class="field full"><label>Notes</label><textarea id="maintenanceNotes"></textarea></div></div><button class="btn btn-navy" style="width:100%;margin-top:16px" type="submit">Save Maintenance</button></form></div><section style="margin-top:24px"><div class="page-title"><div><h1 style="font-size:2rem">Fleet</h1></div></div><div class="vehicle-list" id="vehicleList"></div></section><section style="margin-top:24px"><div class="table-card"><h2>Maintenance Schedule</h2><table><thead><tr><th>Vehicle</th><th>Type</th><th>Due Date</th><th>Due km</th><th>Status</th><th>Cost</th></tr></thead><tbody id="maintenanceRows"></tbody></table></div></section></main><script src="app.js"></script><script>function renderFleet(){const vs=HM.get(HM.key.vehicles),ms=HM.get(HM.key.maintenance);maintenanceVehicle.innerHTML=vs.map(v=>`<option value="${v.id}">${v.plate} · ${v.brand} ${v.model}</option>`).join('');vehicleList.innerHTML=vs.length?vs.map(v=>`<article class="vehicle-card"><div><h3>${v.plate} · ${v.brand} ${v.model}</h3><div class="vehicle-meta"><span>${v.id}</span><span>${v.energy}</span><span>${v.seats} seats</span><span>${v.status}</span></div><div class="vehicle-kpis"><div><small>Trips</small><strong>${v.trips||0}</strong></div><div><small>Revenue</small><strong>${HM.money(v.revenue||0)}</strong></div><div><small>Odometer</small><strong>${Number(v.odometer||0).toLocaleString()} km</strong></div><div><small>Battery</small><strong>${v.energy==='EV'?(v.battery||0)+'%':'—'}</strong></div></div><p class="notice" style="margin-bottom:0">Next service: ${Number(v.nextServiceKm||0).toLocaleString()} km · Insurance: ${v.insuranceExpiry||'—'} · Registration: ${v.registrationExpiry||'—'}</p></div><span class="badge ${v.status==='Available'?'green':v.status==='Maintenance'?'red':'orange'}">${v.status}</span></article>`).join(''):'<div class="empty">No vehicles registered.</div>';maintenanceRows.innerHTML=ms.map(m=>`<tr><td>${m.vehicleId}</td><td>${m.type}</td><td>${m.dueDate||'—'}</td><td>${m.dueKm||'—'}</td><td><span class="badge ${m.status==='Completed'?'green':'orange'}">${m.status}</span></td><td>${HM.money(m.cost||0)}</td></tr>`).join('')||'<tr><td colspan="6">No maintenance records.</td></tr>'}document.addEventListener('DOMContentLoaded',()=>{renderFleet();vehicleForm.addEventListener('submit',e=>{e.preventDefault();const vs=HM.get(HM.key.vehicles);vs.unshift({id:vehicleId.value||HM.uid('VEH'),plate:plate.value,brand:brand.value,model:model.value,year:year.value,energy:energy.value,seats:Number(seats.value),odometer:Number(odometer.value),status:status.value,battery:Number(battery.value),revenue:0,trips:0,hours:0,nextServiceKm:Number(nextServiceKm.value),insuranceExpiry:insuranceExpiry.value,registrationExpiry:registrationExpiry.value,notes:vehicleNotes.value});HM.set(HM.key.vehicles,vs);e.target.reset();renderFleet()});maintenanceForm.addEventListener('submit',e=>{e.preventDefault();const ms=HM.get(HM.key.maintenance);ms.unshift({id:HM.uid('MT'),vehicleId:maintenanceVehicle.value,type:maintenanceType.value,status:maintenanceStatus.value,dueDate:maintenanceDate.value,dueKm:Number(maintenanceKm.value||0),cost:Number(maintenanceCost.value||0),notes:maintenanceNotes.value});HM.set(HM.key.maintenance,ms);e.target.reset();renderFleet()})});</script></body></html>
