<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Sign Up | HERO Move</title><link rel="stylesheet" href="styles.css"><style>body{background:linear-gradient(145deg,#edf6fb,#fff);min-height:100vh}.wrap{max-width:560px;margin:auto;padding:30px 18px 60px}.card{background:#fff;border-radius:26px;padding:28px;box-shadow:0 16px 50px #09233b1a}.tag{display:inline-block;background:#e8f8f2;color:#087a55;padding:8px 12px;border-radius:99px;font-weight:900}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px;color:#16314e}.pw{display:flex;gap:8px}.field input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd8e3;border-radius:13px;font-size:16px}.eye{min-width:58px;border:1px solid #cbd8e3;background:#f5f8fb;border-radius:13px;font-size:20px}.big{width:100%;padding:16px;margin-top:10px;font-size:17px}.note{background:#f3f7fa;padding:14px;border-radius:14px;margin-top:16px}.ok{color:#087a42;font-weight:800}.err{color:#a22b2b;font-weight:700}.hint{font-size:13px;margin-top:5px;color:#667}.match{color:#087a42}.lang{float:right;border:0;background:#edf3f7;padding:8px 10px;border-radius:10px}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a></header><main class="wrap"><div class="card"><button class="lang" id="lang">ไทย</button><span class="tag" data-en="DRIVER · JOIN HERO MOVE" data-th="คนขับ · เข้าร่วม HERO MOVE">DRIVER · JOIN HERO MOVE</span><h1 data-en="Driver Sign Up" data-th="สมัครคนขับ HERO Move">Driver Sign Up</h1><p data-en="Create your secure driver account. After HERO Move approves your driver profile, you can receive assigned trips and use LiveTrack™." data-th="สร้างบัญชีคนขับอย่างปลอดภัย เมื่อ HERO Move อนุมัติโปรไฟล์แล้ว คุณจะรับงานที่ได้รับมอบหมายและใช้ LiveTrack™ ได้">Create your secure driver account. After HERO Move approves your driver profile, you can receive assigned trips and use LiveTrack™.</p><form id="form"><div class="field"><label data-en="Full name" data-th="ชื่อ-นามสกุล">Full name</label><input id="name" required autocomplete="name"></div><div class="field"><label data-en="Mobile" data-th="เบอร์โทรศัพท์">Mobile</label><input id="mobile" required inputmode="tel" autocomplete="tel"></div><div class="field"><label>Email</label><input id="email" required type="email" autocomplete="email"></div><div class="field"><label data-en="Password" data-th="รหัสผ่าน">Password</label><div class="pw"><input id="password" required type="password" minlength="8" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" class="eye" data-target="password">👁</button></div></div><div class="field"><label data-en="Confirm password" data-th="ยืนยันรหัสผ่าน">Confirm password</label><div class="pw"><input id="confirm" required type="password" minlength="8" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" class="eye" data-target="confirm">👁</button></div><div class="hint" id="match"></div></div><button class="btn btn-primary big" type="submit" id="submit" data-en="CREATE DRIVER ACCOUNT" data-th="สร้างบัญชีคนขับ">CREATE DRIVER ACCOUNT</button></form><p id="message"></p><div class="note"><strong data-en="Already approved?" data-th="ได้รับอนุมัติแล้ว?">Already approved?</strong> <a href="login.html?next=driver-portal.html" data-en="Driver Sign In" data-th="เข้าสู่ระบบคนขับ">Driver Sign In</a></div></div></main><script src="app.js"></script><script>let th=false;const byId=x=>document.getElementById(x);const form=byId('form'),lang=byId('lang'),password=byId('password'),confirmPw=byId('confirm'),message=byId('message'),submit=byId('submit'),match=byId('match');function apply(){document.querySelectorAll('[data-en]').forEach(x=>x.textContent=x.dataset[th?'th':'en']);lang.textContent=th?'EN':'ไทย';check()}lang.onclick=()=>{th=!th;apply()};document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const x=byId(b.dataset.target);x.type=x.type==='password'?'text':'password'});function check(){if(!confirmPw.value){match.textContent='';return}const yes=password.value===confirmPw.value;match.className='hint '+(yes?'match':'err');match.textContent=yes?(th?'✓ รหัสผ่านตรงกัน':'✓ Passwords match'):(th?'รหัสผ่านยังไม่ตรงกัน':'Passwords do not match yet')}password.addEventListener('input',check);confirmPw.addEventListener('input',check);form.onsubmit=async e=>{e.preventDefault();message.className='';message.textContent='';const p=password.value,c=confirmPw.value;if(p!==c){message.className='err';message.textContent=th?'รหัสผ่านไม่ตรงกัน กรุณากดรูปตาเพื่อตรวจสอบทั้งสองช่อง':'Passwords do not match. Tap the eye buttons to check both entries.';confirmPw.focus();return}submit.disabled=true;try{const data=await HM.auth.signUp(byId('email').value.trim(),p,{full_name:byId('name').value.trim(),mobile:byId('mobile').value.trim(),requested_role:'driver'});localStorage.setItem('hm_driver_application',JSON.stringify({user_id:data.user?.id||null,email:byId('email').value.trim(),full_name:byId('name').value.trim(),mobile:byId('mobile').value.trim(),created_at:new Date().toISOString()}));message.className='ok';message.textContent=th?'สมัครสำเร็จ กรุณายืนยันอีเมล (ถ้ามี) แล้วรอ HERO Move อนุมัติคนขับ':'Account created. Confirm your email if requested, then HERO Move will approve your Driver access.';form.reset();match.textContent=''}catch(err){message.className='err';message.textContent=err.message}finally{submit.disabled=false}};</script></body></html>
