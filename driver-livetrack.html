<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver LiveTrack | HERO Move</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f8fb}.wrap{max-width:650px;margin:auto;padding:28px 18px}.card{background:white;padding:26px;border-radius:24px;box-shadow:0 12px 40px #09233b18}.pulse{width:90px;height:90px;border-radius:50%;background:#e8f8f2;display:grid;place-items:center;font-size:40px;margin:15px auto}.live{background:#e8fff0;color:#087a42;padding:8px 12px;border-radius:99px;font-weight:900}.off{background:#f2f4f6;color:#677;padding:8px 12px;border-radius:99px;font-weight:900}.big{width:100%;padding:17px;font-size:1.05rem;margin-top:14px}.data{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.data div{background:#f5f8fb;padding:14px;border-radius:14px}.data strong{display:block;font-size:1.15rem;color:#08284e}.err{color:#a32b2b}.share{display:none;background:#eef8ff;border-radius:15px;padding:14px;margin-top:16px;word-break:break-all}.share a{font-weight:800}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a></header><main class="wrap"><div class="card"><span class="eyebrow">DRIVER · LIVETRACK™</span><h1>Share live vehicle location</h1><div class="pulse">🚘</div><p style="text-align:center"><span id="state" class="off">TRACKING OFF</span></p><div class="data"><div>Latitude<strong id="lat">—</strong></div><div>Longitude<strong id="lng">—</strong></div><div>Accuracy<strong id="acc">—</strong></div><div>Speed<strong id="spd">—</strong></div></div><label>Assigned Trip</label><input id="trip" style="width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd8e2;border-radius:12px" placeholder="Booking UUID"><button id="start" class="btn btn-primary big">START LIVE TRACKING</button><button id="stop" class="btn btn-outline big" disabled>STOP</button><div class="share" id="share"><strong>Customer LiveTrack™ link</strong><br><a id="customerLink" target="_blank"></a><button id="copy" class="btn btn-outline big" type="button">COPY CUSTOMER LINK</button></div><p id="msg">Your phone will ask permission to use precise location.</p><p class="err" id="error"></p></div></main><script src="app.js"></script><script>let watch=null,lastSent=0;const $=id=>document.getElementById(id);async function customerToken(id,s){const r=await fetch(HM.config.supabaseUrl+'/rest/v1/rpc/create_live_tracking_session',{method:'POST',headers:{apikey:HM.config.publishableKey,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({p_booking_id:id})});if(!r.ok)throw new Error(await r.text());const token=await r.json(),url=location.origin+'/livetrack.html?token='+encodeURIComponent(token);$('customerLink').href=url;$('customerLink').textContent=url;$('share').style.display='block'}async function send(p){const s=HM.auth.session();if(!s?.access_token)throw new Error('Please sign in to the HERO Move driver account first.');const id=$('trip').value.trim();if(!id)throw new Error('No assigned trip selected.');const now=Date.now();if(now-lastSent<3000)return;lastSent=now;const c=p.coords;const res=await fetch(HM.config.supabaseUrl+'/rest/v1/trip_live_locations',{method:'POST',headers:{apikey:HM.config.publishableKey,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({operator_id:HM.bootData.operator.id,booking_id:id,latitude:c.latitude,longitude:c.longitude,accuracy_m:c.accuracy,speed_mps:c.speed,heading_deg:c.heading,altitude_m:c.altitude,recorded_at:new Date(p.timestamp).toISOString()})});if(!res.ok)throw new Error((await res.text())||'Location update rejected');$('msg').textContent='Live location sent · '+new Date().toLocaleTimeString()}function got(p){$('lat').textContent=p.coords.latitude.toFixed(6);$('lng').textContent=p.coords.longitude.toFixed(6);$('acc').textContent=Math.round(p.coords.accuracy)+' m';$('spd').textContent=p.coords.speed==null?'—':Math.round(p.coords.speed*3.6)+' km/h';send(p).catch(e=>$('error').textContent=e.message)}$('start').onclick=async()=>{try{await HM.bootstrap();$('error').textContent='';const s=HM.auth.session();if(!s?.access_token)throw new Error('Please sign in first.');const id=$('trip').value.trim();if(!id)throw new Error('Enter the assigned booking for this test.');await customerToken(id,s);if(!navigator.geolocation)throw new Error('GPS is not available in this browser.');watch=navigator.geolocation.watchPosition(got,e=>$('error').textContent=e.message,{enableHighAccuracy:true,maximumAge:2000,timeout:15000});$('state').textContent='● LIVE';$('state').className='live';$('start').disabled=true;$('stop').disabled=false}catch(e){$('error').textContent=e.message}};$('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;$('state').textContent='TRACKING OFF';$('state').className='off';$('start').disabled=false;$('stop').disabled=true};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('customerLink').href);$('copy').textContent='COPIED ✓'};</script></body></html>
