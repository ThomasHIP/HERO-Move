<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver | HERO Move</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a><div class="top-actions"><a class="btn btn-outline small-btn" href="index.html">Home</a></div></header><main class="page-shell"><div class="page-title"><div><span class="eyebrow">DRIVER PORTAL</span><h1>My Jobs</h1><p>Drivers see only assigned trips, passenger details, trip status, mileage and incident notes — no fleet finance or operator administration.</p></div></div><form class="form-card" id="driverSelectForm"><div class="form-grid"><div class="field full"><label>Driver</label><select id="driverSelect"></select></div></div></form><section class="dashboard-grid"><div class="stat"><small>Assigned Jobs</small><strong id="assignedCount">0</strong></div><div class="stat"><small>Completed Trips</small><strong id="tripCount">0</strong></div><div class="stat"><small>Hours</small><strong id="hoursCount">0</strong></div><div class="stat"><small>Rating</small><strong id="ratingCount">0</strong></div></section><div id="jobCards" class="cards two" style="margin-top:24px"></div></main><script src="app.js"></script><script>function render(){const ds=HM.get(HM.key.drivers),bs=HM.get(HM.key.bookings);driverSelect.innerHTML=ds.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')||'<option>No drivers</option>';const id=localStorage.getItem('hm_driver_session')||ds[0]?.id||'';if(id)driverSelect.value=id;const d=ds.find(x=>x.id===driverSelect.value)||ds[0];if(!d){jobCards.innerHTML='<div class="card"><h3>No driver profile</h3></div>';return}localStorage.setItem('hm_driver_session',d.id);const jobs=bs.filter(b=>b.driverId===d.id&&!['Cancelled'].includes(b.status));assignedCount.textContent=jobs.filter(b=>b.status!=='Completed').length;tripCount.textContent=d.trips||0;hoursCount.textContent=Number(d.hours||0).toFixed(1);ratingCount.textContent=Number(d.rating||0).toFixed(1);jobCards.innerHTML=jobs.length?jobs.map(b=>`<div class="card"><span class="badge ${b.status==='Completed'?'green':'orange'}">${b.status}</span><h3 style="margin-top:12px">${b.date||'—'} · ${b.time||''}</h3><p><strong>${b.service}</strong><br>${b.pickup||''} → ${b.dest1||''}${b.dest2?'<br>→ '+b.dest2:''}</p><p>Passenger: <strong>${b.customer||'—'}</strong><br>Mobile: ${b.mobile||'—'}<br>Passengers: ${b.passengers||'—'} · Luggage: ${b.luggage||0}</p><p class="notice">${b.notes||''}</p>${b.status!=='Completed'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-navy" onclick="setStatus('${b.id}','On Trip')">Start Trip</button><button class="btn btn-primary" onclick="completeTrip('${b.id}')">Complete Trip</button></div>`:''}</div>`).join(''):'<div class="card"><h3>No assigned jobs</h3><p>Your assigned jobs will appear here.</p></div>'}function setStatus(id,status){const bs=HM.get(HM.key.bookings),b=bs.find(x=>x.id===id);if(!b)return;b.status=status;b.updatedAt=new Date().toISOString();HM.set(HM.key.bookings,bs);render()}function completeTrip(id){const km=prompt('Trip distance (km):','0');if(km===null)return;const hrs=prompt('Operating hours:','0');if(hrs===null)return;const note=prompt('Incident / trip note (optional):','')||'';const bs=HM.get(HM.key.bookings),b=bs.find(x=>x.id===id);if(!b)return;b.tripDistance=Number(km||0);b.tripHours=Number(hrs||0);b.driverCompletionNote=note;b.status='Completed';b.driverCompletedAt=new Date().toISOString();HM.set(HM.key.bookings,bs);alert('Trip marked Completed. Operator dashboard will finalize performance and ESG posting.');render()}document.addEventListener('DOMContentLoaded',()=>{render();driverSelect.addEventListener('change',render)});</script></body></html>
