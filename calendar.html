<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar | HERO Move</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">HM</span><strong>HERO <em>Move</em></strong></a><div class="top-actions"><a class="btn btn-primary small-btn" href="booking.html">New Booking</a></div></header><main class="page-shell"><div class="tabs"><a href="admin.html">Dashboard</a><a href="booking.html">Bookings</a><a class="active" href="calendar.html">Calendar</a><a href="fleet.html">Fleet</a><a href="drivers.html">Drivers</a><a href="customers.html">Customers</a><a href="dispatch.html">Dispatch</a><a href="esg.html">ESG</a></div><div class="page-title"><div><span class="eyebrow">ADVANCE AVAILABILITY</span><h1>Booking & fleet calendar</h1><p>See upcoming bookings by date together with assigned vehicle, driver and trip status.</p></div></div><div class="form-card" style="margin-bottom:20px"><div class="form-grid"><div class="field"><label>From</label><input id="fromDate" type="date"></div><div class="field"><label>To</label><input id="toDate" type="date"></div></div></div><div id="calendarGroups"></div></main><script src="app.js"></script><script>function renderCalendar(){const bs=HM.get(HM.key.bookings),vs=HM.get(HM.key.vehicles),ds=HM.get(HM.key.drivers),from=fromDate.value,to=toDate.value;const filtered=bs.filter(b=>(!from||b.date>=from)&&(!to||b.date<=to)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const groups={};filtered.forEach(b=>(groups[b.date||'Unscheduled']??=[]).push(b));calendarGroups.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([date,items])=>`<section style="margin-bottom:18px"><div class="table-card"><h2>${date}</h2><table><thead><tr><th>Time</th><th>Booking</th><th>Customer</th><th>Trip</th><th>Vehicle</th><th>Driver</th><th>Status</th></tr></thead><tbody>${items.map(b=>{const v=vs.find(x=>x.id===b.vehicleId),d=ds.find(x=>x.id===b.driverId);return `<tr><td>${b.time||'—'}</td><td>${b.id}</td><td>${b.customer||'—'}</td><td>${b.pickup||'—'} → ${b.dest1||'—'}</td><td>${v?v.plate:'Unassigned'}</td><td>${d?d.name:'Unassigned'}</td><td><span class="badge ${b.status==='Completed'?'green':b.status==='Cancelled'?'red':'orange'}">${b.status}</span></td></tr>`}).join('')}</tbody></table></div></section>`).join(''):'<div class="empty">No bookings in this date range.</div>'}document.addEventListener('DOMContentLoaded',()=>{const today=new Date(),future=new Date(today);future.setDate(today.getDate()+30);fromDate.value=today.toISOString().slice(0,10);toDate.value=future.toISOString().slice(0,10);renderCalendar();fromDate.addEventListener('change',renderCalendar);toDate.addEventListener('change',renderCalendar)});</script></body></html>
